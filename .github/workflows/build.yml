name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack project
        run: |
          ZIP="$(git log --diff-filter=AM --name-only --pretty=format: -- '*.zip' | sed '/^$/d' | head -n1)"
          echo "Using archive: $ZIP"
          unzip -o "$ZIP" -d work
          sed -i "s/fabric-loom' version '[^']*'/fabric-loom' version '1.19.3'/" work/squarehotbar/build.gradle
          sed -i "s/Type.KEYSYM/Type.KEYBOARD/" work/squarehotbar/src/main/java/com/example/squarehotbar/SquareHotbarClient.java
          grep -n "fabric-loom" work/squarehotbar/build.gradle
          ls -R work/squarehotbar/src/main/java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.8.0
      - name: Build
        working-directory: work/squarehotbar
        run: |
          for i in 1 2 3 4; do gradle build && exit 0; echo "retry $i"; sleep 90; done; exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: squarehotbar-26.3-mod
          path: work/squarehotbar/build/libs/squarehotbar-2.0.0.jar
